# Aura LLM Gateway Configuration
# Copy this file to config.yaml and customize for your deployment
#
# Configuration priority (highest to lowest):
# 1. Environment variables
# 2. This YAML file
# 3. Default values
#
# For Kubernetes deployments:
# - Mount this file from a ConfigMap
# - Inject secrets (API keys) via environment variables from Secrets

server:
  # Host address to bind the server to
  host: "0.0.0.0"
  # Port number for the server
  port: 8080

# Provider API keys
# NOTE: For production, prefer environment variables for sensitive values:
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_API_KEY
#   MISTRAL_API_KEY, TOGETHER_API_KEY, HUGGINGFACE_API_KEY, HUGGINGFACE_ENDPOINT_URL,
#   HUGGINGFACE_MODEL, OLLAMA_BASE_URL, AWS_REGION
providers:
  # OpenAI API key (optional)
  # openai_api_key: "sk-..."

  # Anthropic API key (optional)
  # anthropic_api_key: "sk-ant-..."

  # Google Gemini API key (optional)
  # google_api_key: "..."

  # Mistral AI API key (optional)
  # Enables: mistral-large-latest, mistral-small-latest, codestral-latest, etc.
  # mistral_api_key: "..."

  # Together AI API key (optional)
  # Enables hosted open models like Llama, DeepSeek, Qwen, Mixtral, and DBRX.
  # together_api_key: "..."

  # HuggingFace TGI — Inference Endpoints (optional)
  # Both api_key and endpoint_url are required to activate this provider.
  # Each deployment has its own endpoint URL; the model name is optional but
  # helps with routing when multiple HF endpoints are registered.
  # huggingface_api_key: "hf_..."
  # huggingface_endpoint_url: "https://your-endpoint.endpoints.huggingface.cloud"
  # huggingface_model: "meta-llama/Llama-3.1-8B-Instruct"

  # Ollama — local inference server (optional, no API key required)
  # Supports any model pulled locally; set OLLAMA_BASE_URL or leave unset to
  # use the default http://localhost:11434.
  # ollama_base_url: "http://localhost:11434"

  # AWS Bedrock (optional)
  # Set the region to enable. Credentials are resolved via the standard AWS
  # credential chain (env vars → ~/.aws/credentials → EC2/ECS IAM role).
  # aws_region: "us-east-1"

logging:
  # Log level: trace, debug, info, warn, error
  # Can also use complex filters: "info,aura_proxy=debug"
  level: "info"

database:
  # PostgreSQL connection URL (required for persistence features)
  # NOTE: For production, use DATABASE_URL environment variable
  # url: "postgres://user:pass@localhost/aura"
  url: null

redis:
  # Redis connection URL (required for rate limiting and caching)
  # NOTE: For production, use REDIS_URL environment variable
  # url: "redis://localhost:6379"
  url: null

admin:
  # Admin API key for administrative endpoints
  # NOTE: For production, use AURA_ADMIN_KEY environment variable
  # key: "admin-secret-key"
  key: null

# Smart routing. Only read from this file (set AURA_CONFIG_FILE=/path/to/config.yaml);
# there is no environment-variable form for these settings except the
# AURA_AUTO_ROUTING=on|off kill switch for `routing.auto.enabled`.
routing:
  # Complexity-based auto model routing: `model: "auto"` / `auto:cost` /
  # `auto:balanced` / `auto:quality`. See docs/api/auto-routing.md.
  auto:
    # Master switch for real `auto` requests (default: false).
    enabled: false
    # Mode used when neither the alias suffix nor the request sets one.
    default_mode: balanced          # cost | balanced | quality
    # Score requests that pin a concrete model too and report the decision
    # `auto` would have made under metadata.aura.routing with shadow: true.
    shadow_for_pinned_models: true
    # Candidate models per tier, in preference order. Models this gateway
    # cannot serve (no provider key) are dropped at startup.
    tiers:
      simple: [gemini-3.1-flash-lite, gpt-5.4-nano, claude-haiku-4-5]
      medium: [gemini-3.5-flash, gpt-5.4-mini, claude-sonnet-4-6]
      complex: [claude-sonnet-4-6, gpt-5.5, gemini-3.1-pro-preview]
      reasoning: [claude-opus-4-7, gpt-5.5-pro, o3-mini]
    # Complexity score boundaries (inclusive lower bound of the upper tier).
    boundaries:
      simple_medium: 0.15
      medium_complex: 0.35
      complex_reasoning: 0.60
    # Score offsets per mode.
    mode_offsets:
      cost: -0.10
      balanced: 0.0
      quality: 0.15
    # Heuristic feature weights. Feature values are in [-1, 1].
    weights:
      tokens: 0.10
      code: 0.30
      reasoning: 0.25
      technical: 0.25
      simple: 0.05
      multi_step: 0.03
      questions: 0.02
      tools: 0.15
      explicit_intent: 0.30
      continuation: 0.05
      output_length: 0.05
    token_thresholds:
      short: 15        # at or below: strong "simple" signal
      long: 400        # at or above: strong "complex" signal
      long_output: 2000
    # How to pick among the eligible candidates of the chosen tier.
    within_tier: cheapest           # cheapest | config_order | round_robin
    # Keep the previous turn's model on tool-loop continuation turns.
    sticky_tool_loops: true
    # Requests that carry tools never go below this tier.
    tools_min_tier: medium
    # Distinct reasoning markers that force the reasoning tier.
    reasoning_override_matches: 3
    # keywords: { code: [...], reasoning: [...], technical: [...], simple: [...],
    #             intent_quick: [...], intent_deep: [...] }  — override the built-in lists
