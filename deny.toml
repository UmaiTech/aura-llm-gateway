# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]

# Ignore advisories for specific IDs. Each entry is a transitive dependency
# with no patched version we can reach. See .cargo/audit.toml for the full
# rationale per ID. audit.toml also ignores RUSTSEC-2023-0071, which only
# cargo-audit sees (it scans unused lockfile entries). Revisit on dep bumps:
# cargo-deny warns (advisory-not-detected) once an entry no longer matches.
ignore = [
    # rand 0.8.5 — unsound informational, pinned by sqlx-postgres.
    "RUSTSEC-2026-0097",
    # unsafe-libyaml — unmaintained (informational, no patched release),
    # via serde_yaml. Parses operator-supplied config only. Review by
    # 2027-01-31; fix is migrating off serde_yaml.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained, no patched release; parses operator config only; review 2027-01-31" },
]

[licenses]
# Allowed licenses for the project
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"

# Lint level for when a crate version requirement is `*`
wildcards = "allow"

# The graph highlighting used when creating dotgraphs for crates
highlight = "all"

[sources]
# Lint level for what to happen when a crate from a crate registry that is not
# in the allow list is encountered
unknown-registry = "warn"

# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "warn"

# List of URLs for allowed crate registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
