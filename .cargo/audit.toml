# cargo-audit configuration
# https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# Ignore advisories for specific IDs. Each entry is a transitive dependency
# we cannot bump ourselves (pinned by an upstream crate's version constraint).
# Re-evaluate on every dependency bump — remove entries once the upstream
# releases a fixed version. Verify with `cargo audit`.
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack in the rsa crate (no fixed release).
    # rsa is locked only as a dependency of sqlx-mysql, which we never compile
    # (sqlx uses default-features = false with only postgres). cargo-audit
    # scans every crate in Cargo.lock, so it still reports it. cargo-deny
    # resolves features, never sees rsa, and so needs no ignore for it.
    "RUSTSEC-2023-0071",

    # rand 0.8.5 — "unsound with a custom logger" (informational). Pinned by
    # sqlx-postgres 0.8 and used directly by aura-core; rand 0.9 is an API
    # break. Not exploitable in our usage.
    "RUSTSEC-2026-0097",

    # unsafe-libyaml 0.2.11 — unmaintained (informational, no CVE, no
    # patched release: the repository was archived in 2024-03). Pulled in by
    # serde_yaml 0.9 (itself deprecated), which aura-core uses to parse and
    # print its own config files. That input comes from the operator, not
    # from API requests. Fix: migrate to a safe-Rust parser (serde-saphyr).
    # Review by 2027-01-31.
    "RUSTSEC-2024-0449",
]
